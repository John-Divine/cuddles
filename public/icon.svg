<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="roseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb7185" />
      <stop offset="100%" stop-color="#e11d48" />
    </linearGradient>
    <linearGradient id="violetGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Base Squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bg)" />
  
  <!-- Subtle ambient inner glow ring -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#312e81" stroke-width="2" opacity="0.4" stroke-dasharray="8 8" />
  
  <!-- Interlocking Connection Nodes (Symbolizing two partners + friends knot) -->
  <g transform="translate(256, 256)">
    <!-- Shield / Lock background -->
    <path d="M-60,-40 C-60,-80 60,-80 60,-40 C60,40 0,90 0,90 C0,90 -60,40 -60,-40 Z" fill="#4338ca" opacity="0.25" />
    
    <!-- Partner 1 Ring (Rose) -->
    <circle cx="-54" cy="-10" r="68" fill="none" stroke="url(#roseGrad)" stroke-width="22" filter="url(#glow)" opacity="0.9" />
    
    <!-- Partner 2 Ring (Violet) -->
    <circle cx="54" cy="-10" r="68" fill="none" stroke="url(#violetGrad)" stroke-width="22" filter="url(#glow)" opacity="0.9" />
    
    <!-- Center Secure Lock Pin -->
    <circle cx="0" cy="-10" r="28" fill="#ffffff" />
    <path d="M-10,-10 L10,-10 L8,14 L-8,14 Z" fill="#0f172a" />
    <circle cx="0" cy="-3" r="4" fill="#6366f1" />
    
    <!-- Small orbital nodes representing friends -->
    <circle cx="-110" cy="80" r="14" fill="#38bdf8" />
    <circle cx="110" cy="80" r="14" fill="#a855f7" />
    <circle cx="0" cy="115" r="14" fill="#34d399" />
    
    <!-- Connecting threads -->
    <path d="M-54,58 Q-80,80 -96,80" stroke="#38bdf8" stroke-width="4" stroke-dasharray="4 4" fill="none" opacity="0.7" />
    <path d="M54,58 Q80,80 96,80" stroke="#a855f7" stroke-width="4" stroke-dasharray="4 4" fill="none" opacity="0.7" />
    <path d="M0,80 L0,101" stroke="#34d399" stroke-width="4" stroke-dasharray="4 4" fill="none" opacity="0.7" />
  </g>
</svg>
